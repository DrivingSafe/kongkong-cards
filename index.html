<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe3f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <title>콩콩 카드</title>
</head>
<body>
  <div class="bg-float" aria-hidden="true"><span>💗</span><span>✦</span><span>🫧</span><span>♡</span><span>✦</span><span>💗</span><span>♡</span></div>

  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn back-btn hidden" id="backButton" aria-label="처음으로">←</button>
      <button class="brand" id="brand">
        <svg class="brand-bunny" viewBox="0 0 64 64" aria-hidden="true"><use href="#bunny"/></svg>
        <span id="brandText">콩콩 카드</span>
      </button>
      <div class="top-actions">
        <button class="star-pill" id="starButton" aria-label="스티커북"><img src="img/emoji/2b50.webp" alt=""><span id="starCount">0</span></button>
        <button class="icon-btn gear-btn" id="settingsButton" aria-label="보호자 설정 (꾹 누르기)">
          <svg class="hold-ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21"/></svg>
          <span>⚙️</span>
        </button>
      </div>
    </header>

    <main>
      <!-- 홈 -->
      <section class="screen home-screen active" id="homeScreen">
        <div class="hero">
          <div class="hero-copy">
            <p class="eyebrow" id="heroEyebrow"></p>
            <h1 id="heroTitle"></h1>
          </div>
          <button class="buddy" id="heroBuddy" aria-label="콩콩이">
            <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#bunny"/></svg>
            <span class="buddy-bubble" id="buddyWave"></span>
          </button>
        </div>

        <div class="game-row">
          <button class="game-btn quiz" id="startQuiz">
            <img src="img/emoji/1f50d.webp" alt="">
            <strong id="quizBannerTitle"></strong>
            <small id="quizBannerNote"></small>
          </button>
          <button class="game-btn bubbles-game" id="startBubbles">
            <img src="img/emoji/1fae7.webp" alt="">
            <strong id="bubbleBannerTitle"></strong>
            <small id="bubbleBannerNote"></small>
          </button>
        </div>

        <h2 class="section-title" id="categoryTitle"></h2>
        <div class="category-grid" id="categoryGrid"></div>

        <button class="review-banner hidden-el" id="startReview">
          <img src="img/emoji/1f49d.webp" alt="">
          <span><strong id="reviewTitle"></strong><small id="reviewNote"></small></span>
          <span class="arrow">›</span>
        </button>
      </section>

      <!-- 카드 -->
      <section class="screen card-screen" id="cardScreen">
        <div class="card-heading">
          <div class="card-title"><img id="categoryIcon" alt=""><h2 id="categoryLabel"></h2></div>
          <div class="progress-hearts" id="progressHearts" aria-label="진행"></div>
        </div>

        <div class="flashcard-wrap">
          <div class="card-stack" aria-hidden="true"><span></span><span></span></div>
          <article class="flashcard" id="flashcard" tabindex="0" aria-live="polite">
            <div class="card-sparkles" aria-hidden="true"><span>✦</span><span>♡</span><span>✦</span></div>
            <div class="tap-finger" id="tapFinger" aria-hidden="true"><img src="img/emoji/1f446.webp" alt=""></div>
            <div class="card-art" id="cardArt"></div>
            <h3 id="cardWord"></h3>
            <p class="card-sub" id="cardSub"></p>
            <p class="card-sound" id="cardSound"></p>
          </article>
          <div class="nudge" id="nudge" aria-live="polite"></div>
        </div>

        <div class="card-controls">
          <button class="ctrl-btn listen" id="soundButton"><img src="img/emoji/1f50a.webp" alt=""><span id="soundLabel"></span></button>
          <button class="ctrl-btn next" id="nextButton">
            <span class="next-fill" id="nextFill"></span>
            <span class="next-label" id="nextLabel"></span>
          </button>
        </div>
        <p class="swipe-hint" id="swipeHint"></p>
      </section>

      <!-- 찾기 놀이 -->
      <section class="screen quiz-screen" id="quizScreen">
        <div class="quiz-header">
          <h2 id="quizPrompt"></h2>
          <button class="listen-prompt" id="listenPrompt"><img src="img/emoji/1f50a.webp" alt=""><span id="listenLabel"></span></button>
          <div class="quiz-score" id="quizScore"></div>
        </div>
        <div class="quiz-grid" id="quizGrid"></div>
        <div class="quiz-feedback" id="quizFeedback" aria-live="assertive"></div>
      </section>

      <!-- 비눗방울 놀이 -->
      <section class="screen bubble-screen" id="bubbleScreen">
        <div class="bubble-top">
          <h2 id="bubbleTitle"></h2>
          <div class="bubble-count"><img src="img/emoji/1fae7.webp" alt=""><span id="bubbleCount">0</span></div>
        </div>
        <div class="bubble-field" id="bubbleField"></div>
      </section>
    </main>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="toast" id="toast" aria-live="polite"></div>

  <!-- 보호자 설정 -->
  <div class="modal-overlay" id="settingsModal" aria-hidden="true">
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <button class="modal-close" id="closeSettings" aria-label="닫기">×</button>
      <h2 id="settingsTitle"></h2>
      <div id="settingsBody"></div>
      <label class="setting-label" id="categorySettingLabel"></label>
      <div class="category-settings" id="categorySettings"></div>
      <div class="setting-extra">
        <button class="soft-btn" id="fullscreenButton"></button>
        <button class="soft-btn hidden-el" id="installApp"></button>
        <button class="soft-btn danger" id="resetProgress"></button>
      </div>
      <button class="primary-btn" id="saveSettings"></button>
      <p class="credit">3D 그림: Microsoft Fluent Emoji (MIT)</p>
    </section>
  </div>

  <!-- 완료 -->
  <div class="modal-overlay" id="completionModal" aria-hidden="true">
    <section class="panel completion" role="dialog" aria-modal="true">
      <div class="big-sticker"><img id="earnedSticker" alt=""></div>
      <h2 id="completionTitle"></h2>
      <p id="completionNote"></p>
      <div class="completion-actions">
        <button class="primary-btn" id="againSession"></button>
        <button class="soft-btn" id="finishSession"></button>
      </div>
    </section>
  </div>

  <!-- 스티커북 -->
  <div class="modal-overlay" id="stickerModal" aria-hidden="true">
    <section class="panel" role="dialog" aria-modal="true">
      <button class="modal-close" id="closeStickers" aria-label="닫기">×</button>
      <h2 id="stickerTitle"></h2>
      <p class="sticker-note" id="stickerNote"></p>
      <div class="sticker-book" id="stickerBook"></div>
    </section>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="bunny" viewBox="0 0 64 64">
      <ellipse cx="22" cy="17" rx="7" ry="15" fill="#ffb3d1" stroke="#6b3a5e" stroke-width="3"/>
      <ellipse cx="42" cy="17" rx="7" ry="15" fill="#ffb3d1" stroke="#6b3a5e" stroke-width="3"/>
      <ellipse cx="22" cy="18" rx="3" ry="9" fill="#ff7fb3"/>
      <ellipse cx="42" cy="18" rx="3" ry="9" fill="#ff7fb3"/>
      <ellipse cx="32" cy="41" rx="24" ry="20" fill="#ffd6e8" stroke="#6b3a5e" stroke-width="3"/>
      <circle cx="24" cy="39" r="3" fill="#6b3a5e"/><circle cx="40" cy="39" r="3" fill="#6b3a5e"/>
      <circle cx="25" cy="38" r="1" fill="#fff"/><circle cx="41" cy="38" r="1" fill="#fff"/>
      <ellipse cx="18" cy="46" rx="4" ry="2.6" fill="#ff8fbf" opacity=".8"/>
      <ellipse cx="46" cy="46" rx="4" ry="2.6" fill="#ff8fbf" opacity=".8"/>
      <path d="M28 46 q4 4 8 0" fill="none" stroke="#6b3a5e" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M44 22 l6 -3 l-1 6 z" fill="#ff5fa2" stroke="#6b3a5e" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M44 22 l-4 -5 l-1 7 z" fill="#ff5fa2" stroke="#6b3a5e" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
